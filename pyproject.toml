[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-layer-csi-anomaly-detection"
version = "0.3.0"
description = "Controlled cross-layer physical-presence emulation for payment anomaly detection with Wi-Fi CSI."
requires-python = ">=3.11"
dependencies = [
  "gdown>=5.2",
  "kaggle>=1.6.17",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "scipy>=1.13",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]
two-phase = ["lightgbm>=4.6", "xgboost>=3.4"]

[project.scripts]
cross-layer-csi = "cross_layer_csi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
